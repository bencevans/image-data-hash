[project]
name = "image_data_hash"
version = "0.1.0"
description = "Native ExifTool-compatible JPEG image data hashing"
readme = "README.md"
authors = [
    { name = "Ben Evans", email = "Benjamin.Evans@ioz.ac.uk" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/bencevans/image-data-hash"
Repository = "https://github.com/bencevans/image-data-hash"
Issues = "https://github.com/bencevans/image-data-hash/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3.5", "black>=25.1.0"]
