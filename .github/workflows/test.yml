name: test

on:
  push:
  pull_request:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - run: python3 fixtures/generate.py fixtures/generated
      - uses: actions/upload-artifact@v4
        with:
          name: exif-fixtures
          path: fixtures/generated
  python:
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: exif-fixtures
          path: fixtures/generated
      - run: uv run pytest -q
        working-directory: pixel-hash-py
  javascript:
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: exif-fixtures
          path: fixtures/generated
      - run: npm test
        working-directory: pixel-hash-js
  rust:
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: exif-fixtures
          path: fixtures/generated
      - run: cargo test
        working-directory: pixel-hash-rs
  r:
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::digest
            any::testthat
      - uses: actions/download-artifact@v4
        with:
          name: exif-fixtures
          path: fixtures/generated
      - run: Rscript -e 'testthat::test_file("test_jpeg_content_sha256.R", reporter = "stop")'
        working-directory: pixel-hash-r
  php:
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - uses: actions/download-artifact@v4
        with:
          name: exif-fixtures
          path: fixtures/generated
      - run: php -d zend.assertions=1 -d assert.exception=1 test.php
        working-directory: pixel-hash-php
