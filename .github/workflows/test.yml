name: test

on:
  push:
  pull_request:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl libjpeg-turbo-progs
      - run: python3 fixtures/generate.py fixtures/generated
      - uses: actions/upload-artifact@v4
        with:
          name: exif-fixtures
          path: fixtures/generated
  python:
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: exif-fixtures
          path: fixtures/generated
      - run: uv run black --check src tests
        working-directory: image-data-hash-py
      - run: uv run pytest -q
        working-directory: image-data-hash-py
      - run: uv build
        working-directory: image-data-hash-py
  javascript:
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: exif-fixtures
          path: fixtures/generated
      - run: npm ci
        working-directory: image-data-hash-js
      - run: npm run format:check
        working-directory: image-data-hash-js
      - run: npm test
        working-directory: image-data-hash-js
      - run: npm pack --dry-run
        working-directory: image-data-hash-js
  rust:
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: exif-fixtures
          path: fixtures/generated
      - run: cargo test
        working-directory: image-data-hash-rs
      - run: cargo fmt --check && cargo doc --no-deps
        working-directory: image-data-hash-rs
  r:
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::digest
            any::testthat
            any::styler
      - uses: actions/download-artifact@v4
        with:
          name: exif-fixtures
          path: fixtures/generated
      - run: Rscript -e 'testthat::test_file("test_image_data_hash.R", reporter = "stop")'
        working-directory: image-data-hash-r
      - run: R CMD build image-data-hash-r && R CMD check --no-manual imageDataHash_0.1.0.tar.gz
  php:
    needs: fixtures
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - uses: actions/download-artifact@v4
        with:
          name: exif-fixtures
          path: fixtures/generated
      - run: composer validate --strict
      - run: composer install --no-interaction --no-plugins --no-scripts
        working-directory: image-data-hash-php
      - run: composer format:check
        working-directory: image-data-hash-php
      - run: composer test
        working-directory: image-data-hash-php
